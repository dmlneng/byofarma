document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;\n}\n/* latin */\n@font-face {\n  font-family: 'Asap';\n  font-style: normal;\n  font-weight: 700;\n  font-stretch: 100%;\n  font-display: swap;\n  src: url(\"f4809ea7-0b98-4956-997b-0457e0676735\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n<\u002Fstyle>\n<script src=\"9ce9d540-cd64-408a-af2d-4655607a888f\"><\u002Fscript>\n<style>\n  body { margin: 0; background: #F7FBF0; font-family: \"Asap\", system-ui, sans-serif; }\n  a { color: #4A9E00; text-decoration: none; }\n  a:hover { color: #2E6B00; text-decoration: underline; }\n  ::-webkit-scrollbar { width: 10px; height: 10px; }\n  ::-webkit-scrollbar-thumb { background: #D9E8BC; border-radius: 800px; }\n<\u002Fstyle>\n<\u002Fhelmet>\n\n\n\n<div style=\"min-height:100vh;background:#F7FBF0;padding:32px 28px 56px;font-family:'Asap',system-ui,sans-serif;color:#434445\">\n<div style=\"max-width:1320px;margin:0 auto;display:flex;flex-direction:column;gap:20px\">\n\n  <div style=\"display:flex;justify-content:space-between;align-items:flex-end;gap:24px;flex-wrap:wrap\">\n    <div style=\"display:flex;align-items:center;gap:22px\">\n      <img src=\"d7319010-e39e-4205-ab86-dfe6f3365a18\" alt=\"Byofarma\" style=\"height:64px;width:auto;display:block\">\n      <span style=\"width:1px;height:58px;background:#EFEFEF\"><\u002Fspan>\n      <div style=\"display:flex;flex-direction:column;gap:5px\">\n        <h1 style=\"margin:0;font-size:34px;font-weight:700;line-height:1.15;color:#292A2B\">Produtividade do laboratório<\u002Fh1>\n        <p style=\"margin:0;font-size:16px;color:#5D5F61\">{{ subheader }}<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"display:flex;gap:10px;align-items:center\">\n      <button sc-camel-on-click=\"{{ limpar }}\" style=\"border:1px solid #4A9E00;background:#fff;color:#4A9E00;border-radius:8px;padding:9px 20px;font-family:inherit;font-size:15px;cursor:pointer;transition:.15s\" style-hover=\"background:#F1F8E1\">Limpar filtros<\u002Fbutton>\n      <button sc-camel-on-click=\"{{ exportar }}\" style=\"border:1px solid #4A9E00;background:#fff;color:#4A9E00;border-radius:8px;padding:9px 20px;font-family:inherit;font-size:15px;cursor:pointer;transition:.15s\" style-hover=\"background:#F1F8E1\">Exportar CSV<\u002Fbutton>\n      <button sc-camel-on-click=\"{{ abrirUpload }}\" style=\"border:1px solid #4A9E00;background:#fff;color:#4A9E00;border-radius:8px;padding:9px 20px;font-family:inherit;font-size:15px;cursor:pointer;transition:.15s\" style-hover=\"background:#F1F8E1\">Substituir base<\u002Fbutton>\n      <button sc-camel-on-click=\"{{ abrirAnexo }}\" style=\"border:none;background:#4A9E00;color:#fff;border-radius:8px;padding:10px 22px;font-family:inherit;font-size:15px;cursor:pointer;transition:.15s\" style-hover=\"background:#2E6B00\">Adicionar dia<\u002Fbutton>\n      <input type=\"file\" accept=\".xlsx,.csv\" ref=\"{{ fileRef }}\" sc-camel-on-change=\"{{ onArquivo }}\" style=\"display:none\">\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div style=\"display:flex;flex-direction:column;gap:12px;background:#fff;border:1px solid #EFEFEF;border-radius:8px;box-shadow:0 2px 6px rgba(46,107,0,.08);padding:16px 18px\">\n    <div style=\"display:flex;gap:14px;flex-wrap:wrap;align-items:center\">\n      <span style=\"font-size:13px;font-weight:600;color:#5D5F61;letter-spacing:.04em;text-transform:uppercase;width:96px;flex:none\">Colaborador<\u002Fspan>\n      <div style=\"display:flex;gap:8px;flex-wrap:wrap\">\n        <sc-for list=\"{{ chipsPessoa }}\" as=\"c\" hint-placeholder-count=\"4\">\n          <button sc-camel-on-click=\"{{ c.toggle }}\" style=\"{{ c.style }}\">{{ c.label }}<\u002Fbutton>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n      <div style=\"margin-left:auto;display:flex;align-items:center;gap:8px;border:1px solid #EFEFEF;border-radius:8px;padding:7px 12px;background:#F7FBF0\">\n        <svg width=\"17\" height=\"17\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#4A9E00\" stroke-width=\"2\" stroke-linecap=\"round\"><circle cx=\"11\" cy=\"11\" r=\"7\"><\u002Fcircle><line x1=\"16.5\" y1=\"16.5\" x2=\"21\" y2=\"21\"><\u002Fline><\u002Fsvg>\n        <input value=\"{{ busca }}\" sc-camel-on-change=\"{{ onBusca }}\" placeholder=\"Buscar requisição\" style=\"border:none;background:transparent;outline:none;font-family:inherit;font-size:15px;color:#292A2B;width:170px\">\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"display:flex;gap:14px;flex-wrap:wrap;align-items:center\">\n      <span style=\"font-size:13px;font-weight:600;color:#5D5F61;letter-spacing:.04em;text-transform:uppercase;width:96px;flex:none\">Tamanho<\u002Fspan>\n      <div style=\"display:flex;gap:8px;flex-wrap:wrap\">\n        <sc-for list=\"{{ chipsTam }}\" as=\"c\" hint-placeholder-count=\"5\">\n          <button sc-camel-on-click=\"{{ c.toggle }}\" style=\"{{ c.style }}\">{{ c.label }}<\u002Fbutton>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"display:flex;gap:14px;flex-wrap:wrap;align-items:center\">\n      <span style=\"font-size:13px;font-weight:600;color:#5D5F61;letter-spacing:.04em;text-transform:uppercase;width:96px;flex:none\">Cor<\u002Fspan>\n      <div style=\"display:flex;gap:8px;flex-wrap:wrap\">\n        <sc-for list=\"{{ chipsCor }}\" as=\"c\" hint-placeholder-count=\"6\">\n          <button sc-camel-on-click=\"{{ c.toggle }}\" style=\"{{ c.style }}\">{{ c.label }}<\u002Fbutton>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"display:flex;gap:14px;flex-wrap:wrap;align-items:center;border-top:1px solid #EFEFEF;padding-top:12px\">\n      <span style=\"font-size:13px;font-weight:600;color:#5D5F61;letter-spacing:.04em;text-transform:uppercase;width:96px;flex:none\">Período<\u002Fspan>\n      <sc-raw-select value=\"{{ mes }}\" sc-camel-on-change=\"{{ onMes }}\" style=\"border:1px solid #EFEFEF;background:#F7FBF0;border-radius:8px;padding:7px 10px;font-family:inherit;font-size:14px;color:#292A2B;cursor:pointer\">\n        <sc-for list=\"{{ opcoesMes }}\" as=\"o\" hint-placeholder-count=\"2\">\n          <option value=\"{{ o.v }}\">{{ o.label }}<\u002Foption>\n        <\u002Fsc-for>\n      <\u002Fsc-raw-select>\n      <div style=\"display:flex;align-items:center;gap:6px\">\n        <sc-raw-select value=\"{{ ini }}\" sc-camel-on-change=\"{{ onIni }}\" style=\"border:1px solid #EFEFEF;background:#F7FBF0;border-radius:8px;padding:7px 10px;font-family:inherit;font-size:14px;color:#292A2B;cursor:pointer\">\n          <sc-for list=\"{{ opcoesIni }}\" as=\"o\" hint-placeholder-count=\"4\">\n            <option value=\"{{ o.v }}\">{{ o.label }}<\u002Foption>\n          <\u002Fsc-for>\n        <\u002Fsc-raw-select>\n        <span style=\"font-size:14px;color:#5D5F61\">até<\u002Fspan>\n        <sc-raw-select value=\"{{ fim }}\" sc-camel-on-change=\"{{ onFim }}\" style=\"border:1px solid #EFEFEF;background:#F7FBF0;border-radius:8px;padding:7px 10px;font-family:inherit;font-size:14px;color:#292A2B;cursor:pointer\">\n          <sc-for list=\"{{ opcoesFim }}\" as=\"o\" hint-placeholder-count=\"4\">\n            <option value=\"{{ o.v }}\">{{ o.label }}<\u002Foption>\n          <\u002Fsc-for>\n        <\u002Fsc-raw-select>\n        <sc-for list=\"{{ atalhos }}\" as=\"a\" hint-placeholder-count=\"2\">\n          <button sc-camel-on-click=\"{{ a.click }}\" style=\"border:1px solid #EFEFEF;background:#fff;color:#4A9E00;border-radius:800px;padding:6px 13px;font-family:inherit;font-size:13px;cursor:pointer;transition:.15s\" style-hover=\"background:#F1F8E1\">{{ a.label }}<\u002Fbutton>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div style=\"display:grid;grid-template-columns:repeat(5,1fr);gap:16px\">\n    <sc-for list=\"{{ kpis }}\" as=\"k\" hint-placeholder-count=\"5\">\n      <div style=\"background:#fff;border:1px solid #EFEFEF;border-radius:8px;box-shadow:0 2px 6px rgba(46,107,0,.08);padding:18px 20px;display:flex;flex-direction:column;gap:6px\">\n        <span style=\"font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:#5D5F61\">{{ k.label }}<\u002Fspan>\n        <span style=\"font-size:32px;font-weight:700;line-height:1.1;color:#4A9E00\">{{ k.valor }}<\u002Fspan>\n        <span style=\"font-size:13px;color:#5D5F61\">{{ k.nota }}<\u002Fspan>\n      <\u002Fdiv>\n    <\u002Fsc-for>\n  <\u002Fdiv>\n\n  <div style=\"background:#fff;border:1px solid #EFEFEF;border-radius:8px;box-shadow:0 4px 16px rgba(46,107,0,.08);padding:22px 24px 18px;display:flex;flex-direction:column;gap:18px\">\n    <div style=\"display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap\">\n      <div style=\"display:flex;flex-direction:column;gap:2px\">\n        <h2 style=\"margin:0;font-size:22px;font-weight:700;color:#292A2B\">{{ tituloDiario }}<\u002Fh2>\n        <span style=\"font-size:14px;color:#5D5F61\">{{ subtituloDiario }}<\u002Fspan>\n      <\u002Fdiv>\n      <div style=\"display:flex;gap:16px;flex-wrap:wrap\">\n        <sc-for list=\"{{ legenda }}\" as=\"l\" hint-placeholder-count=\"4\">\n          <span style=\"display:flex;align-items:center;gap:7px;font-size:14px;color:#434445\"><span style=\"{{ l.dot }}\"><\u002Fspan>{{ l.nome }}<\u002Fspan>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"position:relative;display:flex;align-items:flex-end;gap:10px;height:270px;padding-top:8px;border-bottom:1px solid #EFEFEF\">\n      <sc-if value=\"{{ temMeta }}\" hint-placeholder-val=\"{{ false }}\">\n        <div style=\"{{ metaStyle }}\"><span style=\"position:absolute;right:0;top:-18px;font-size:12px;font-weight:600;color:#8CBF00;background:#fff;padding:0 4px\">meta {{ metaLabel }}<\u002Fspan><\u002Fdiv>\n      <\u002Fsc-if>\n      <sc-for list=\"{{ barrasDia }}\" as=\"b\" hint-placeholder-count=\"10\">\n        <div style=\"flex:1;max-width:96px;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:6px;height:100%\">\n          <span style=\"font-size:12px;font-weight:600;color:#292A2B\">{{ b.totalLabel }}<\u002Fspan>\n          <div style=\"{{ b.colStyle }}\">\n            <sc-for list=\"{{ b.segs }}\" as=\"s\" hint-placeholder-count=\"3\">\n              <div title=\"{{ s.title }}\" style=\"{{ s.style }}\"><\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n    <div style=\"display:flex;gap:10px\">\n      <sc-for list=\"{{ barrasDia }}\" as=\"b\" hint-placeholder-count=\"10\">\n        <span style=\"flex:1;max-width:96px;text-align:center;font-size:13px;color:#5D5F61\">{{ b.dia }}<\u002Fspan>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div style=\"background:#fff;border:1px solid #EFEFEF;border-radius:8px;box-shadow:0 4px 16px rgba(46,107,0,.08);padding:22px 24px;display:flex;flex-direction:column;gap:18px\">\n    <div style=\"display:flex;flex-direction:column;gap:2px\">\n      <h2 style=\"margin:0;font-size:22px;font-weight:700;color:#292A2B\">Produtividade por colaborador<\u002Fh2>\n      <span style=\"font-size:14px;color:#5D5F61\">Cáps/dia e req/dia consideram apenas os dias em que a pessoa produziu<\u002Fspan>\n    <\u002Fdiv>\n    <div style=\"display:flex;flex-direction:column;gap:0\">\n      <div style=\"display:grid;grid-template-columns:1.6fr .9fr .7fr .8fr .8fr .8fr;gap:12px;padding:0 4px 8px;border-bottom:1px solid #EFEFEF\">\n        <sc-for list=\"{{ cabecalhoEquipe }}\" as=\"h\" hint-placeholder-count=\"6\">\n          <span style=\"{{ h.style }}\">{{ h.label }}<\u002Fspan>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n      <sc-for list=\"{{ equipe }}\" as=\"p\" hint-placeholder-count=\"4\">\n        <div style=\"display:grid;grid-template-columns:1.6fr .9fr .7fr .8fr .8fr .8fr;gap:12px;align-items:center;padding:12px 4px;border-bottom:1px solid #F1F8E1\">\n          <div style=\"display:flex;flex-direction:column;gap:6px\">\n            <span style=\"display:flex;align-items:center;gap:8px;font-size:17px;font-weight:600;color:#292A2B\"><span style=\"{{ p.dot }}\"><\u002Fspan>{{ p.nome }}<\u002Fspan>\n            <div style=\"height:10px;border-radius:800px;background:#F1F8E1;overflow:hidden\">\n              <div style=\"{{ p.barStyle }}\"><\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <span style=\"font-size:17px;font-weight:600;color:#292A2B;text-align:right;font-variant-numeric:tabular-nums\">{{ p.caps }}<\u002Fspan>\n          <span style=\"font-size:15px;color:#434445;text-align:right;font-variant-numeric:tabular-nums\">{{ p.reqs }}<\u002Fspan>\n          <span style=\"font-size:15px;color:#434445;text-align:right;font-variant-numeric:tabular-nums\">{{ p.capsDia }}<\u002Fspan>\n          <span style=\"font-size:15px;color:#434445;text-align:right;font-variant-numeric:tabular-nums\">{{ p.reqDia }}<\u002Fspan>\n          <span style=\"font-size:15px;font-weight:600;color:#4A9E00;text-align:right;font-variant-numeric:tabular-nums\">{{ p.share }}<\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div style=\"display:flex;flex-direction:column;gap:6px;margin-top:8px\">\n    <h2 style=\"margin:0;font-size:22px;font-weight:700;color:#292A2B\">Planejamento de insumos<\u002Fh2>\n    <p style=\"margin:0;font-size:15px;color:#5D5F61;max-width:820px\">Consumo de cápsulas por tamanho e cor no período filtrado. A projeção multiplica a média por dia produtivo pelos dias úteis configurados no mês.<\u002Fp>\n  <\u002Fdiv>\n\n  <div style=\"display:grid;grid-template-columns:1fr;gap:16px\">\n    <div style=\"background:#fff;border:1px solid #EFEFEF;border-radius:8px;box-shadow:0 4px 16px rgba(46,107,0,.08);padding:22px 24px;display:flex;flex-direction:column;gap:16px\">\n      <h3 style=\"margin:0;font-size:18px;font-weight:600;color:#292A2B\">Por tamanho de cápsula<\u002Fh3>\n      <div style=\"display:flex;flex-direction:column;gap:12px\">\n        <sc-for list=\"{{ insumoTam }}\" as=\"t\" hint-placeholder-count=\"5\">\n          <div style=\"display:flex;align-items:center;gap:12px\">\n            <span style=\"width:64px;flex:none;font-size:15px;font-weight:600;color:#4A9E00\">{{ t.label }}<\u002Fspan>\n            <div style=\"flex:1;min-width:160px;height:12px;border-radius:800px;background:#F1F8E1;overflow:hidden\">\n              <div style=\"{{ t.barStyle }}\"><\u002Fdiv>\n            <\u002Fdiv>\n            <span style=\"width:104px;flex:none;text-align:right;font-size:14px;color:#434445;font-variant-numeric:tabular-nums\">{{ t.caps }} · {{ t.pct }}<\u002Fspan>\n            <span style=\"width:112px;flex:none;text-align:right;font-size:14px;font-weight:600;color:#2E6B00;font-variant-numeric:tabular-nums\">{{ t.proj }}<\u002Fspan>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n      <span style=\"font-size:13px;color:#5D5F61\">Última coluna: projeção de consumo para o mês inteiro.<\u002Fspan>\n    <\u002Fdiv>\n\n    <div style=\"background:#fff;border:1px solid #EFEFEF;border-radius:8px;box-shadow:0 4px 16px rgba(46,107,0,.08);padding:22px 24px;display:flex;flex-direction:column;gap:16px\">\n      <h3 style=\"margin:0;font-size:18px;font-weight:600;color:#292A2B\">Por cor / acabamento<\u002Fh3>\n      <div style=\"display:flex;flex-direction:column;gap:12px\">\n        <sc-for list=\"{{ insumoCor }}\" as=\"c\" hint-placeholder-count=\"6\">\n          <div style=\"display:flex;align-items:center;gap:12px\">\n            <span style=\"width:104px;flex:none;font-size:15px;font-weight:600;color:#4A9E00\">{{ c.label }}<\u002Fspan>\n            <div style=\"flex:1;min-width:160px;height:12px;border-radius:800px;background:#F1F8E1;overflow:hidden\">\n              <div style=\"{{ c.barStyle }}\"><\u002Fdiv>\n            <\u002Fdiv>\n            <span style=\"width:104px;flex:none;text-align:right;font-size:14px;color:#434445;font-variant-numeric:tabular-nums\">{{ c.caps }} · {{ c.pct }}<\u002Fspan>\n            <span style=\"width:112px;flex:none;text-align:right;font-size:14px;font-weight:600;color:#2E6B00;font-variant-numeric:tabular-nums\">{{ c.proj }}<\u002Fspan>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n      <span style=\"font-size:13px;color:#5D5F61\">{{ notaCor }}<\u002Fspan>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div style=\"background:#fff;border:1px solid #EFEFEF;border-radius:8px;box-shadow:0 4px 16px rgba(46,107,0,.08);padding:22px 24px;display:flex;flex-direction:column;gap:16px;overflow:auto\">\n    <div style=\"display:flex;flex-direction:column;gap:2px\">\n      <h3 style=\"margin:0;font-size:18px;font-weight:600;color:#292A2B\">Matriz tamanho × cor<\u002Fh3>\n      <span style=\"font-size:14px;color:#5D5F61\">Cápsulas por combinação — a lista de compra sai daqui<\u002Fspan>\n    <\u002Fdiv>\n    <sc-raw-table style=\"border-collapse:collapse;font-size:14px;min-width:100%\">\n      <sc-raw-thead>\n        <sc-raw-tr>\n          <sc-raw-th style=\"padding:9px 12px;text-align:left;font-size:12px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:#2E6B00;background:#F1F8E1;border-radius:6px 0 0 0;position:sticky;left:0\">Tamanho<\u002Fsc-raw-th>\n          <sc-for list=\"{{ matrizCores }}\" as=\"c\" hint-placeholder-count=\"6\">\n            <sc-raw-th style=\"padding:9px 12px;text-align:right;font-size:12px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:#2E6B00;background:#F1F8E1;white-space:nowrap\">{{ c }}<\u002Fsc-raw-th>\n          <\u002Fsc-for>\n          <sc-raw-th style=\"padding:9px 12px;text-align:right;font-size:12px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:#2E6B00;background:#F1F8E1;white-space:nowrap\">Total<\u002Fsc-raw-th>\n        <\u002Fsc-raw-tr>\n      <\u002Fsc-raw-thead>\n      <sc-raw-tbody>\n        <sc-for list=\"{{ matriz }}\" as=\"l\" hint-placeholder-count=\"5\">\n          <sc-raw-tr>\n            <sc-raw-td style=\"padding:9px 12px;font-weight:600;color:#292A2B;white-space:nowrap;background:#fff;position:sticky;left:0\">{{ l.tam }}<\u002Fsc-raw-td>\n            <sc-for list=\"{{ l.celulas }}\" as=\"c\" hint-placeholder-count=\"6\">\n              <sc-raw-td title=\"{{ c.title }}\" style=\"{{ c.style }}\">{{ c.valor }}<\u002Fsc-raw-td>\n            <\u002Fsc-for>\n            <sc-raw-td style=\"padding:9px 12px;text-align:right;font-weight:700;color:#2E6B00;font-variant-numeric:tabular-nums\">{{ l.total }}<\u002Fsc-raw-td>\n          <\u002Fsc-raw-tr>\n        <\u002Fsc-for>\n        <sc-raw-tr style=\"border-top:2px solid #EFEFEF\">\n          <sc-raw-td style=\"padding:9px 12px;font-weight:600;color:#5D5F61;background:#fff;position:sticky;left:0\">Total<\u002Fsc-raw-td>\n          <sc-for list=\"{{ matrizTotais }}\" as=\"t\" hint-placeholder-count=\"6\">\n            <sc-raw-td style=\"padding:9px 12px;text-align:right;font-weight:700;color:#2E6B00;font-variant-numeric:tabular-nums\">{{ t }}<\u002Fsc-raw-td>\n          <\u002Fsc-for>\n          <sc-raw-td style=\"padding:9px 12px;text-align:right;font-weight:700;color:#292A2B;font-variant-numeric:tabular-nums\">{{ matrizTotalGeral }}<\u002Fsc-raw-td>\n        <\u002Fsc-raw-tr>\n      <\u002Fsc-raw-tbody>\n    <\u002Fsc-raw-table>\n  <\u002Fdiv>\n\n  <sc-if value=\"{{ mostrarTabela }}\" hint-placeholder-val=\"{{ true }}\">\n    <div style=\"background:#fff;border:1px solid #EFEFEF;border-radius:8px;box-shadow:0 4px 16px rgba(46,107,0,.08);padding:22px 24px;display:flex;flex-direction:column;gap:14px\">\n      <div style=\"display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap\">\n        <h2 style=\"margin:0;font-size:22px;font-weight:700;color:#292A2B\">Detalhamento<\u002Fh2>\n        <span style=\"font-size:14px;color:#5D5F61\">{{ tabelaNota }}<\u002Fspan>\n      <\u002Fdiv>\n      <div style=\"max-height:420px;overflow:auto;border:1px solid #EFEFEF;border-radius:8px\">\n        <sc-raw-table style=\"width:100%;border-collapse:collapse;font-size:15px\">\n          <sc-raw-thead>\n            <sc-raw-tr>\n              <sc-for list=\"{{ colunas }}\" as=\"c\" hint-placeholder-count=\"6\">\n                <sc-raw-th sc-camel-on-click=\"{{ c.sort }}\" style=\"{{ c.style }}\">{{ c.label }}<\u002Fsc-raw-th>\n              <\u002Fsc-for>\n            <\u002Fsc-raw-tr>\n          <\u002Fsc-raw-thead>\n          <sc-raw-tbody>\n            <sc-for list=\"{{ tabela }}\" as=\"l\" hint-placeholder-count=\"12\">\n              <sc-raw-tr style=\"border-top:1px solid #EFEFEF\" style-hover=\"background:#F7FBF0\">\n                <sc-raw-td style=\"padding:9px 16px;color:#434445\">{{ l.d }}<\u002Fsc-raw-td>\n                <sc-raw-td style=\"padding:9px 16px;color:#292A2B;font-weight:500\">{{ l.n }}<\u002Fsc-raw-td>\n                <sc-raw-td style=\"padding:9px 16px;color:#434445;font-variant-numeric:tabular-nums\">{{ l.r }}<\u002Fsc-raw-td>\n                <sc-raw-td style=\"padding:9px 16px;text-align:right;color:#434445;font-variant-numeric:tabular-nums\">{{ l.q }}<\u002Fsc-raw-td>\n                <sc-raw-td style=\"padding:9px 16px;text-align:right;color:#434445\">{{ l.t }}<\u002Fsc-raw-td>\n                <sc-raw-td style=\"padding:9px 16px;text-align:right;color:#434445\">{{ l.c }}<\u002Fsc-raw-td>\n              <\u002Fsc-raw-tr>\n            <\u002Fsc-for>\n          <\u002Fsc-raw-tbody>\n        <\u002Fsc-raw-table>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <div style=\"display:flex;align-items:center;gap:12px;flex-wrap:wrap;background:#F1F8E1;border:1px solid #E2EFC6;border-radius:8px;padding:11px 18px\">\n    <span style=\"font-size:14px;color:#2E6B00;font-weight:600\">Base de dados<\u002Fspan>\n    <span style=\"font-size:14px;color:#434445\">{{ fonteLabel }}<\u002Fspan>\n    <span style=\"margin-left:auto;display:flex;gap:10px;align-items:center\">\n      <span style=\"font-size:13px;color:#5D5F61\">Colunas esperadas: Data · Colaborador · Requisicao · Quantidade · Tamanho · Cor<\u002Fspan>\n      <sc-if value=\"{{ baseCustom }}\" hint-placeholder-val=\"{{ false }}\">\n        <button sc-camel-on-click=\"{{ restaurar }}\" style=\"border:1px solid #B9DE7A;background:#fff;color:#2E6B00;border-radius:800px;padding:6px 14px;font-family:inherit;font-size:13px;cursor:pointer\">Restaurar base original<\u002Fbutton>\n      <\u002Fsc-if>\n    <\u002Fspan>\n  <\u002Fdiv>\n\n  <p style=\"margin:0;font-size:13px;color:#5D5F61;max-width:940px\">{{ rodape }}<\u002Fp>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;metrica&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;Cápsulas&quot;,&quot;Requisições&quot;],&quot;default&quot;:&quot;Cápsulas&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Gráfico diário&quot;},&quot;metaDiaria&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:0,&quot;min&quot;:0,&quot;max&quot;:15000,&quot;step&quot;:250,&quot;tsType&quot;:&quot;number&quot;,&quot;section&quot;:&quot;Gráfico diário&quot;},&quot;diasUteisMes&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:22,&quot;min&quot;:1,&quot;max&quot;:31,&quot;step&quot;:1,&quot;tsType&quot;:&quot;number&quot;,&quot;section&quot;:&quot;Planejamento&quot;},&quot;mostrarTabela&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Conteúdo&quot;}}\">\nconst PAL = ['#4A9E00', '#C6DD00', '#2E6B00', '#8CBF00', '#6B8F3A', '#A3C94E'];\nconst fmt = n => Math.round(n || 0).toLocaleString('pt-BR');\nconst chip = (on, cor) => `border:1px solid ${on ? cor : '#EFEFEF'};background:${on ? cor : '#fff'};color:${on ? '#fff' : '#434445'};border-radius:800px;padding:6px 15px;font-family:inherit;font-size:14px;cursor:pointer;transition:.15s`;\nconst MESES = { '01': 'janeiro', '02': 'fevereiro', '03': 'março', '04': 'abril', '05': 'maio', '06': 'junho', '07': 'julho', '08': 'agosto', '09': 'setembro', '10': 'outubro', '11': 'novembro', '12': 'dezembro' };\nconst rotTam = t => t === 'n/d' ? 'n/d' : /^\\d+$/.test(t) ? 'nº ' + t : t;\n// 000 > 00 > 0 > 1 > 2 ... — tamanhos com zeros são maiores que o nº 0\nconst ordemTam = t => {\n  if (t === 'n/d') return 1e6;\n  if (/^0{2,}$/.test(t)) return -t.length;\n  if (/^\\d+$/.test(t)) return +t;\n  return 1e5;\n};\n\nclass Component extends DCLogic {\n  state = { rows: null, pessoas: [], tams: [], cores: [], selP: [], selT: [], selC: [], busca: '', mes: '', ini: '', fim: '', sortKey: 'q', sortDir: -1 };\n\n  serialParaDia(s) {\n    const d = new Date(Date.UTC(1899, 11, 30) + Number(s) * 86400000);\n    return String(d.getUTCDate()).padStart(2, '0') + '/' + String(d.getUTCMonth() + 1).padStart(2, '0');\n  }\n\n  normalizar(linhas) {\n    const out = [];\n    let ultimaData = null;\n    for (const l of linhas) {\n      let [data, nome, req, qnt, tam, cor] = l.map(v => v == null ? '' : String(v).trim());\n      if (!nome && !data) continue;\n      if (/^\\d{5,}$/.test(data)) { ultimaData = this.serialParaDia(data); }\n      else if (/^\\d{1,2}\\/\\d{1,2}/.test(data)) { ultimaData = data.split(' ')[0].padStart(5, '0'); }\n      const d = ultimaData;\n      if (!d || !nome) continue;\n      const q = parseFloat(String(qnt).replace(/\\./g, '').replace(',', '.')) || 0;\n      let t = tam === '' ? 'n/d' : String(tam);\n      let c = String(cor || '').toUpperCase();\n      if (!c || /^\\d+$/.test(c)) c = 'n/d';\n      out.push({ n: nome, d, r: req, q, t, c });\n    }\n    return out;\n  }\n\n  async lerXlsx(buffer) {\n    const buf = new Uint8Array(buffer), dv = new DataView(buffer);\n    let eocd = -1;\n    for (let i = buf.length - 22; i >= 0; i--) if (dv.getUint32(i, true) === 0x06054b50) { eocd = i; break; }\n    const n = dv.getUint16(eocd + 10, true);\n    let off = dv.getUint32(eocd + 16, true);\n    const files = {};\n    for (let i = 0; i < n; i++) {\n      const nameLen = dv.getUint16(off + 28, true), extraLen = dv.getUint16(off + 30, true), cmtLen = dv.getUint16(off + 32, true);\n      const lho = dv.getUint32(off + 42, true);\n      const name = new TextDecoder().decode(buf.subarray(off + 46, off + 46 + nameLen));\n      const method = dv.getUint16(off + 10, true), csize = dv.getUint32(off + 20, true);\n      const dstart = lho + 30 + dv.getUint16(lho + 26, true) + dv.getUint16(lho + 28, true);\n      files[name] = { method, comp: buf.subarray(dstart, dstart + csize) };\n      off += 46 + nameLen + extraLen + cmtLen;\n    }\n    const inflar = async e => e.method === 0 ? new TextDecoder().decode(e.comp)\n      : await new Response(new Blob([e.comp]).stream().pipeThrough(new DecompressionStream('deflate-raw'))).text();\n    const shared = files['xl/sharedStrings.xml']\n      ? [...(await inflar(files['xl/sharedStrings.xml'])).matchAll(/<si>(.*?)<\\/si>/gs)]\n        .map(m => [...m[1].matchAll(/<t[^>]*>(.*?)<\\/t>/gs)].map(t => t[1]).join(''))\n      : [];\n    const nomeAba = Object.keys(files).filter(k => /^xl\\/worksheets\\/sheet\\d+\\.xml$/.test(k)).sort()[0];\n    const sh = await inflar(files[nomeAba]);\n    return [...sh.matchAll(/<row[^>]*>(.*?)<\\/row>/gs)].map(r => {\n      const cel = {};\n      for (const c of r[1].matchAll(/<c r=\"([A-Z]+)\\d+\"([^>]*?)(?:\\/>|>(.*?)<\\/c>)/gs)) {\n        const attrs = c[2], inner = c[3] || '';\n        let v = (inner.match(/<v>(.*?)<\\/v>/s) || [])[1];\n        if (/t=\"inlineStr\"/.test(attrs)) v = [...inner.matchAll(/<t[^>]*>(.*?)<\\/t>/gs)].map(t => t[1]).join('');\n        else if (/t=\"s\"/.test(attrs)) v = shared[+v];\n        cel[c[1]] = v == null ? '' : v.replace(/&amp;/g, '&').replace(/&lt;/g, '<').replace(/&gt;/g, '>');\n      }\n      return ['A', 'B', 'C', 'D', 'E', 'F'].map(k => cel[k] ?? '');\n    });\n  }\n\n  lerCsv(texto) {\n    const linha0 = texto.split('\\n')[0];\n    const sep = (linha0.match(/;/g) || []).length >= (linha0.match(/,/g) || []).length ? ';' : ',';\n    return texto.replace(/\\r/g, '').split('\\n').filter(l => l.trim()).map(l => l.split(sep).map(c => c.replace(/^\"|\"$/g, '')));\n  }\n\n  dimensoes(rows) {\n    return {\n      pessoas: [...new Set(rows.map(r => r.n))].sort(),\n      tams: [...new Set(rows.map(r => r.t))].sort((a, b) => ordemTam(a) - ordemTam(b) || String(a).localeCompare(b)),\n      cores: [...new Set(rows.map(r => r.c))].sort((a, b) => (a === 'n/d') - (b === 'n/d') || String(a).localeCompare(b))\n    };\n  }\n\n  mesesDe(rows) {\n    return [...new Set(rows.map(r => (r.d || '').split('/')[1]))].filter(Boolean).sort();\n  }\n\n  chaveLinha(r) { return [r.d, r.n, r.r, r.t, r.c, r.q].join('|'); }\n\n  anexar(novas, nomeArquivo) {\n    if (!novas.length) { alert('Não encontrei linhas válidas no arquivo. Confira as colunas: Data, Colaborador, Requisicao, Quantidade, Tamanho, Cor.'); return; }\n    const atuais = this.state.rows || [];\n    const vistos = new Set(atuais.map(r => this.chaveLinha(r)));\n    const inedantes = novas.filter(r => !vistos.has(this.chaveLinha(r)));\n    const diasNovos = [...new Set(inedantes.map(r => r.d))];\n    const carimbo = new Date().toLocaleDateString('pt-BR', { day: '2-digit', month: '2-digit', year: 'numeric' });\n    if (!inedantes.length) {\n      alert('Nada novo para adicionar: todas as linhas do arquivo já estão na base.');\n      return;\n    }\n    this.aplicar([...atuais, ...inedantes], `${nomeArquivo} · ${fmt(inedantes.length)} linhas adicionadas em ${carimbo}${diasNovos.length ? ` (dias ${diasNovos.join(', ')})` : ''}`, true);\n  }\n\n  aplicar(rows, nome, manterFiltros) {\n    if (!rows.length) { alert('Não encontrei linhas válidas no arquivo. Confira as colunas: Data, Colaborador, Requisicao, Quantidade, Tamanho, Cor.'); return; }\n    const meses = this.mesesDe(rows);\n    if (manterFiltros) {\n      this.setState({ rows, ...this.dimensoes(rows), mes: meses[meses.length - 1] || '', ini: '', fim: '', fonte: nome });\n      try {\n        localStorage.setItem('byofarma_base_v2', JSON.stringify(rows));\n        localStorage.setItem('byofarma_base_nome_v2', nome);\n      } catch (e) { /* base grande demais para o navegador guardar */ }\n      return;\n    }\n    this.setState({ rows, ...this.dimensoes(rows), selP: [], selT: [], selC: [], ini: '', fim: '', busca: '', mes: meses[meses.length - 1] || '', fonte: nome });\n    if (nome) {\n      try {\n        localStorage.setItem('byofarma_base_v2', JSON.stringify(rows));\n        localStorage.setItem('byofarma_base_nome_v2', nome);\n      } catch (e) { /* base grande demais para o navegador guardar */ }\n    }\n  }\n\n  async onArquivo(e) {\n    const file = e.target.files && e.target.files[0];\n    if (!file) return;\n    try {\n      let linhas;\n      if (/\\.csv$/i.test(file.name)) linhas = this.lerCsv(await file.text());\n      else linhas = await this.lerXlsx(await file.arrayBuffer());\n      if (linhas.length && /data|nome|colaborador/i.test(String(linhas[0][0]))) linhas = linhas.slice(1);\n      const carimbo = new Date().toLocaleDateString('pt-BR', { day: '2-digit', month: '2-digit', year: 'numeric' });\n      const normalizadas = this.normalizar(linhas);\n      if (this._modo === 'add') this.anexar(normalizadas, file.name);\n      else this.aplicar(normalizadas, `${file.name} · enviado em ${carimbo}`);\n    } catch (err) {\n      alert('Não consegui ler o arquivo: ' + err.message);\n    }\n    e.target.value = '';\n  }\n\n  componentDidMount() {\n    const carregar = rows => {\n      const meses = this.mesesDe(rows);\n      this.setState({ rows, ...this.dimensoes(rows), mes: meses[meses.length - 1] || '' });\n    };\n    let salva = null;\n    try {\n      const s = localStorage.getItem('byofarma_base_v2');\n      if (s) { salva = JSON.parse(s); this.setState({ fonte: localStorage.getItem('byofarma_base_nome_v2') || 'base enviada' }); }\n    } catch (e) { salva = null; }\n    if (salva && salva.length) carregar(salva);\n    else if (window.__REQ) carregar(window.__REQ);\n    else {\n      let t = 0;\n      const esperar = setInterval(() => {\n        if (window.__REQ) { clearInterval(esperar); carregar(window.__REQ); }\n        else if (++t > 40) clearInterval(esperar);\n      }, 50);\n    }\n  }\n\n  dias(rows) {\n    return [...new Set(rows.map(r => r.d))].sort((a, b) => {\n      const [da, ma] = a.split('/'), [db, mb] = b.split('/');\n      return (ma - mb) || (da - db);\n    });\n  }\n\n  doMes(rows) {\n    const m = this.state.mes;\n    return (rows || []).filter(r => !m || (r.d || '').split('/')[1] === m);\n  }\n\n  filtrados() {\n    const { selP, selT, selC, busca, ini, fim } = this.state;\n    const base = this.doMes(this.state.rows);\n    const b = busca.trim().toLowerCase();\n    const ord = Object.fromEntries(this.dias(base).map((d, i) => [d, i]));\n    const a1 = ini ? ord[ini] : -Infinity, a2 = fim ? ord[fim] : Infinity;\n    return base.filter(r =>\n      (!selP.length || selP.includes(r.n)) &&\n      (!selT.length || selT.includes(r.t)) &&\n      (!selC.length || selC.includes(r.c)) &&\n      (ord[r.d] >= a1 && ord[r.d] <= a2) &&\n      (!b || String(r.r).toLowerCase().includes(b)));\n  }\n\n  toggle(key, v) {\n    this.setState(s => ({ [key]: s[key].includes(v) ? s[key].filter(x => x !== v) : [...s[key], v] }));\n  }\n\n  renderVals() {\n    const st = this.state;\n    const baseMes = this.doMes(st.rows);\n    const f = this.filtrados();\n    const metricaReq = this.props.metrica === 'Requisições';\n    const val = arr => metricaReq ? arr.length : arr.reduce((a, r) => a + r.q, 0);\n\n    const cor = {};\n    st.pessoas.forEach((p, i) => cor[p] = PAL[i % PAL.length]);\n\n    const dias = this.dias(f);\n    const diasMes = this.dias(baseMes);\n    const nDias = dias.length || 1;\n    const totalCaps = f.reduce((a, r) => a + r.q, 0);\n    const reqs = new Set(f.map(r => r.r)).size;\n    const maxV = Math.max(1, ...dias.map(d => val(f.filter(r => r.d === d))));\n    const H = 210;\n    const meta = Number(this.props.metaDiaria ?? 0);\n    const diasUteis = Math.max(1, Number(this.props.diasUteisMes ?? 22));\n    const pessoasAtivas = st.pessoas.filter(p => f.some(r => r.n === p));\n    const unidade = metricaReq ? 'requisições' : 'cápsulas';\n    const mesNome = MESES[st.mes] || '—';\n\n    const barrasDia = dias.map(d => {\n      const rd = f.filter(r => r.d === d);\n      const total = val(rd);\n      return {\n        dia: d,\n        totalLabel: fmt(total),\n        colStyle: `width:100%;max-width:76px;display:flex;flex-direction:column-reverse;border-radius:6px 6px 0 0;overflow:hidden;height:${Math.round(total / maxV * H)}px`,\n        segs: pessoasAtivas.map(p => {\n          const v = val(rd.filter(r => r.n === p));\n          return v ? { title: `${p} · ${d} · ${fmt(v)} ${unidade}`, style: `background:${cor[p]};height:${(v / total * 100).toFixed(2)}%` } : null;\n        }).filter(Boolean)\n      };\n    });\n\n    const totCap = Math.max(1, totalCaps);\n    const maxPessoa = Math.max(1, ...st.pessoas.map(p => f.filter(r => r.n === p).reduce((a, r) => a + r.q, 0)));\n    const equipe = pessoasAtivas.map(p => {\n      const rp = f.filter(r => r.n === p);\n      const caps = rp.reduce((a, r) => a + r.q, 0);\n      const nd = new Set(rp.map(r => r.d)).size || 1;\n      return {\n        nome: p, ordem: caps,\n        dot: `width:10px;height:10px;border-radius:800px;background:${cor[p]};display:block;flex:none`,\n        barStyle: `height:100%;width:${(caps / maxPessoa * 100).toFixed(1)}%;background:${cor[p]};border-radius:800px`,\n        caps: fmt(caps),\n        reqs: fmt(rp.length),\n        capsDia: fmt(caps / nd),\n        reqDia: (rp.length / nd).toFixed(1),\n        share: (caps / totCap * 100).toFixed(0) + '%'\n      };\n    }).sort((a, b) => b.ordem - a.ordem);\n\n    const projeta = caps => fmt(caps / nDias * diasUteis);\n    const linhaInsumo = (chaves, campo, rotulo) => {\n      const max = Math.max(1, ...chaves.map(k => f.filter(r => r[campo] === k).reduce((a, r) => a + r.q, 0)));\n      return chaves.map(k => {\n        const caps = f.filter(r => r[campo] === k).reduce((a, r) => a + r.q, 0);\n        return {\n          chave: k, ordem: caps, label: rotulo(k), caps: fmt(caps),\n          pct: (caps / totCap * 100).toFixed(0) + '%',\n          proj: projeta(caps),\n          barStyle: `height:100%;width:${(caps / max * 100).toFixed(1)}%;background:${k === 'n/d' ? '#B9DE7A' : '#4A9E00'};border-radius:800px`\n        };\n      }).filter(x => x.ordem > 0).sort((a, b) => b.ordem - a.ordem);\n    };\n\n    const coresAtivas = st.cores.filter(c => f.some(r => r.c === c));\n    const tamsAtivos = st.tams.filter(t => f.some(r => r.t === t));\n    const maxCel = Math.max(1, ...tamsAtivos.flatMap(t => coresAtivas.map(c => f.filter(r => r.t === t && r.c === c).reduce((a, r) => a + r.q, 0))));\n\n    const colDefs = [['d', 'Data', 'left'], ['n', 'Colaborador', 'left'], ['r', 'Requisição', 'left'], ['q', 'Qtd.', 'right'], ['t', 'Tam.', 'right'], ['c', 'Cor', 'right']];\n    const dOrd = Object.fromEntries(diasMes.map((d, i) => [d, i]));\n    const sorted = [...f].sort((a, b) => {\n      const k = st.sortKey;\n      const va = k === 'd' ? dOrd[a.d] : a[k], vb = k === 'd' ? dOrd[b.d] : b[k];\n      return (va > vb ? 1 : va < vb ? -1 : 0) * st.sortDir;\n    });\n    const limite = 250;\n    const alinhamento = { left: 'left', right: 'right' };\n\n    return {\n      subheader: `Time de manipulação · ${mesNome} · ${diasMes.length ? `dados de ${diasMes[0]} a ${diasMes[diasMes.length - 1]}` : 'sem lançamentos'}`,\n      kpis: [\n        { label: 'Cápsulas', valor: fmt(totalCaps), nota: `${fmt(totalCaps / nDias)} por dia produtivo` },\n        { label: 'Requisições', valor: fmt(reqs), nota: `${fmt(f.length)} lançamentos` },\n        { label: 'Cápsulas por req.', valor: fmt(totalCaps / Math.max(1, reqs)), nota: 'média do período' },\n        { label: 'Dias com produção', valor: fmt(nDias), nota: `${fmt(reqs / nDias)} req/dia` },\n        { label: 'Projeção do mês', valor: fmt(totalCaps / nDias * diasUteis), nota: `${diasUteis} dias úteis` }\n      ],\n      chipsPessoa: st.pessoas.map(p => ({ label: p, style: chip(st.selP.includes(p), cor[p]), toggle: () => this.toggle('selP', p) })),\n      chipsTam: st.tams.map(t => ({ label: rotTam(t), style: chip(st.selT.includes(t), '#4A9E00'), toggle: () => this.toggle('selT', t) })),\n      chipsCor: st.cores.map(c => ({ label: c, style: chip(st.selC.includes(c), '#2E6B00'), toggle: () => this.toggle('selC', c) })),\n      busca: st.busca,\n      onBusca: e => this.setState({ busca: e.target.value }),\n      limpar: () => this.setState({ selP: [], selT: [], selC: [], busca: '', ini: '', fim: '' }),\n      fileRef: el => { this._file = el; },\n      abrirUpload: () => { this._modo = 'sub'; if (this._file) this._file.click(); },\n      abrirAnexo: () => { this._modo = 'add'; if (this._file) this._file.click(); },\n      onArquivo: e => this.onArquivo(e),\n      fonteLabel: st.fonte || `Produtividade mensal.xlsx · ${fmt((st.rows || []).length)} lançamentos`,\n      baseCustom: !!st.fonte,\n      restaurar: () => {\n        try { localStorage.removeItem('byofarma_base_v2'); localStorage.removeItem('byofarma_base_nome_v2'); } catch (e) { }\n        this.setState({ fonte: '' });\n        this.aplicar(window.__REQ || [], '');\n      },\n      mes: st.mes,\n      onMes: e => this.setState({ mes: e.target.value, ini: '', fim: '' }),\n      opcoesMes: this.mesesDe(st.rows || []).map(m => ({ v: m, label: MESES[m] || m })),\n      opcoesIni: [{ v: '', label: 'Início' }, ...diasMes.map(d => ({ v: d, label: d }))],\n      opcoesFim: [{ v: '', label: 'Fim' }, ...diasMes.map(d => ({ v: d, label: d }))],\n      ini: st.ini,\n      fim: st.fim,\n      onIni: e => this.setState({ ini: e.target.value }),\n      onFim: e => this.setState({ fim: e.target.value }),\n      atalhos: [\n        { label: 'Mês inteiro', click: () => this.setState({ ini: '', fim: '' }) },\n        { label: 'Últimos 7 dias', click: () => this.setState({ ini: diasMes[Math.max(0, diasMes.length - 7)] || '', fim: '' }) }\n      ],\n      exportar: () => {\n        const csv = ['Data;Colaborador;Requisicao;Quantidade;Tamanho;Cor', ...sorted.map(r => [r.d, r.n, r.r, r.q, r.t, r.c].join(';'))].join('\\n');\n        const a = document.createElement('a');\n        a.href = URL.createObjectURL(new Blob(['\\ufeff' + csv], { type: 'text/csv;charset=utf-8' }));\n        a.download = 'produtividade-filtrada.csv';\n        a.click();\n      },\n      tituloDiario: metricaReq ? 'Requisições por dia' : 'Cápsulas produzidas por dia',\n      subtituloDiario: `${fmt(dias.length)} dia(s) com lançamento · empilhado por colaborador`,\n      legenda: pessoasAtivas.map(p => ({ nome: p, dot: `width:12px;height:12px;border-radius:800px;background:${cor[p]};display:block` })),\n      temMeta: meta > 0,\n      metaLabel: fmt(meta),\n      metaStyle: `position:absolute;left:0;right:0;bottom:${Math.min(H, meta / maxV * H)}px;border-top:2px dashed #8CBF00;pointer-events:none`,\n      barrasDia,\n      cabecalhoEquipe: [['Colaborador', 'left'], ['Cápsulas', 'right'], ['Req.', 'right'], ['Cáps/dia', 'right'], ['Req/dia', 'right'], ['% do time', 'right']]\n        .map(([label, al]) => ({ label, style: `font-size:12px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:#5D5F61;text-align:${al}` })),\n      equipe,\n      insumoTam: linhaInsumo(st.tams, 't', rotTam),\n      insumoCor: linhaInsumo(st.cores, 'c', c => c),\n      notaCor: `${coresAtivas.length} cor(es) no período${st.cores.includes('n/d') ? ' · “n/d” = linha sem cor preenchida na planilha' : ''}`,\n      matrizCores: coresAtivas,\n      matriz: tamsAtivos.map(t => {\n        const rt = f.filter(r => r.t === t);\n        return {\n          tam: rotTam(t),\n          total: fmt(rt.reduce((a, r) => a + r.q, 0)),\n          celulas: coresAtivas.map(c => {\n            const caps = rt.filter(r => r.c === c).reduce((a, r) => a + r.q, 0);\n            return {\n              valor: caps ? fmt(caps) : '·',\n              title: `${rotTam(t)} · ${c} · ${fmt(caps)} cápsulas`,\n              style: `padding:9px 12px;text-align:right;font-variant-numeric:tabular-nums;color:${caps / maxCel > .55 ? '#fff' : '#434445'};background:rgba(74,158,0,${caps ? (0.12 + caps / maxCel * 0.78).toFixed(2) : 0});font-weight:${caps ? 600 : 400}`\n            };\n          })\n        };\n      }),\n      matrizTotais: coresAtivas.map(c => fmt(f.filter(r => r.c === c).reduce((a, r) => a + r.q, 0))),\n      matrizTotalGeral: fmt(totalCaps),\n      mostrarTabela: this.props.mostrarTabela ?? true,\n      colunas: colDefs.map(([k, label, al]) => ({\n        label: label + (st.sortKey === k ? (st.sortDir === 1 ? ' ↑' : ' ↓') : ''),\n        style: `position:sticky;top:0;background:#F1F8E1;padding:11px 16px;text-align:${alinhamento[al]};font-size:13px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:#2E6B00;cursor:pointer;white-space:nowrap`,\n        sort: () => this.setState(s => ({ sortKey: k, sortDir: s.sortKey === k ? -s.sortDir : (k === 'q' ? -1 : 1) }))\n      })),\n      tabela: sorted.slice(0, limite).map(r => ({ ...r, t: rotTam(r.t) })),\n      tabelaNota: `${fmt(f.length)} lançamentos filtrados${f.length > limite ? ` · exibindo os ${limite} primeiros` : ''}`,\n      rodape: 'Tratamento aplicado à base: datas em formato de série do Excel são convertidas para dd/mm; os tamanhos “00” e “0” são tratados como cápsulas distintas; cores em branco ou preenchidas com números entram como “n/d”. A projeção do mês usa a média por dia produtivo do período filtrado multiplicada pelos dias úteis configurados. Para atualizar, envie um .xlsx ou .csv com as colunas Data, Colaborador, Requisicao, Quantidade, Tamanho e Cor: “Adicionar dia” anexa as linhas à base atual ignorando repetições, e “Substituir base” troca o histórico inteiro pelo arquivo. A base fica salva neste navegador.'\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
